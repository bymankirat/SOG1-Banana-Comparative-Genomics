name: Run SOG1 pipeline

on:
  workflow_dispatch:
    inputs:
      from_step:
        description: "First step to run (1 = download everything again)"
        default: "1"
  push:
    branches: [main]
    paths: ["pipeline/s0*.py", "run_all.py", ".github/workflows/pipeline.yml"]

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sog1
          create-args: >-
            -c conda-forge -c bioconda python=3.12 mafft trimal iqtree
          init-shell: bash
          cache-environment: true

      - name: Install Python packages
        shell: bash -el {0}
        run: |
          mkdir -p results data/derived
          set -o pipefail
          { mafft --version; iqtree2 --version | head -2 || iqtree --version | head -2; trimal --version; } 2>&1 | tee results/setup_log.txt
          pip install -q -r requirements.txt 2>&1 | tee -a results/setup_log.txt

      - name: Install disorder predictor (optional)
        continue-on-error: true
        shell: bash -el {0}
        run: pip install -q metapredict

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('config.py') }}
          restore-keys: raw-

      - name: Run pipeline
        shell: bash -el {0}
        run: |
          set -o pipefail
          mkdir -p results data/derived
          python run_all.py --from "${{ github.event.inputs.from_step || '1' }}" 2>&1 | tee results/run_log.txt

      - name: Tests
        shell: bash -el {0}
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee results/test_log.txt

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "bymankirat"
          git config user.email "msinghsandal@gmail.com"
          git add -A results data/derived docs/results.js 2>/dev/null || git add -A results data/derived || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Pipeline results (run ${{ github.run_number }})"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
